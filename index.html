<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UAJS Smart Campus - Plataforma institucional de servicios universitarios de la Universidad Antonio José de Sucre"
    />
    <meta name="theme-color" content="#14304d" />
    <title>UAJS Smart Campus</title>
    <style>
      /* Pantalla de carga inicial: se pinta antes de descargar el JS y React la
         reemplaza al montar. Sin dependencias externas para que sea inmediata. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #f2f2f2;
        color: #273e4e;
        font-family: "Inter", "Segoe UI", Arial, sans-serif;
      }
      #boot-splash .boot-splash__spinner {
        width: 44px;
        height: 44px;
        margin-bottom: 6px;
        border: 4px solid #dde1e6;
        border-top-color: #025e73;
        border-right-color: #38b396;
        border-radius: 50%;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      #boot-splash .boot-splash__title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      #boot-splash .boot-splash__text {
        margin: 0;
        font-size: 13px;
        opacity: 0.7;
      }
      [data-theme="dark"] #boot-splash {
        background: #0a1520;
        color: #eaf3ff;
      }
      [data-theme="dark"] #boot-splash .boot-splash__spinner {
        border-color: #2a4458;
        border-top-color: #4db8d0;
        border-right-color: #38b396;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var temaGuardado = localStorage.getItem("uajs_theme");
          var tema =
            temaGuardado === "dark" || temaGuardado === "light"
              ? temaGuardado
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", tema);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <span class="boot-splash__spinner" aria-hidden="true"></span>
        <p class="boot-splash__title">UAJS Smart Campus</p>
        <p class="boot-splash__text">Cargando la plataforma...</p>
      </div>
    </div>
    <noscript>
      <p style="font-family: sans-serif; padding: 24px; text-align: center">
        Necesitas activar JavaScript para usar UAJS Smart Campus.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
